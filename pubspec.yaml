name: custom_nepali_calendar
description: >-
  Nepali Bikram Sambat calendar and date picker: single date or range,
  selectable dates marked in your own colours, a live BS/AD switch, Nepali or
  English labels. No dependencies.
version: 4.0.0
repository: https://github.com/sarojkhanal51/custom_nepali_calendar
issue_tracker: https://github.com/sarojkhanal51/custom_nepali_calendar/issues

# Surfaced as tags on pub.dev and used by its search.
topics:
  - calendar
  - date-picker
  - nepali
  - bikram-sambat
  - localization

# Rendered as a gallery on the package page.
screenshots:
  - description: >-
      Single-date picker open in a bottom sheet.
    path: doc/screenshots/single_sheet.png
  - description: >-
      Range picker open in a bottom sheet.
    path: doc/screenshots/range_sheet.png
  - description: >-
      Single-date picker open as a centred dialog.
    path: doc/screenshots/single_center.png
  - description: >-
      Range picker open as a centred dialog.
    path: doc/screenshots/range_center.png
  - description: >-
      Selectable dates marked in their own colours: bookable days bordered in
      green and amber, everything else disabled.
    path: doc/screenshots/selectable_slots.png
  - description: >-
      HorizontalDateStrip: an inline row of days, with the full calendar one
      tap away.
    path: doc/screenshots/horizontal_strip.png

environment:
  sdk: ^3.10.0
  flutter: ">=3.16.0"

# No third-party dependencies by design: only the Dart core libraries and the
# Flutter SDK are used, so the package adds zero transitive weight and works on
# every platform Flutter supports without extra setup.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
