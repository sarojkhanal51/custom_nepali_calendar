name: custom_nepali_calendar
description: >-
  Nepali Bikram Sambat calendar and date picker in a bottom sheet: single date
  or range, custom theme colours, live BS/AD switch, Nepali or English. No
  dependencies.
version: 2.1.0
repository: https://github.com/sarojkhanal51/custom_nepali_calendar
issue_tracker: https://github.com/sarojkhanal51/custom_nepali_calendar/issues

# Surfaced as tags on pub.dev and used by its search.
topics:
  - calendar
  - date-picker
  - nepali
  - bikram-sambat
  - localization

# Rendered as a gallery on the package page.
screenshots:
  - description: >-
      The range picker open in a bottom sheet, in Nepali, with the days between
      the two ends banded and dates outside the allowed window greyed out.
    path: doc/screenshots/range_sheet.png

environment:
  sdk: ^3.10.0
  flutter: ">=3.16.0"

# No third-party dependencies by design: only the Dart core libraries and the
# Flutter SDK are used, so the package adds zero transitive weight and works on
# every platform Flutter supports without extra setup.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
